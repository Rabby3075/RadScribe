[project]
name = "radscribe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "chromadb>=1.3.6",
    "imagehash>=4.3.2",
    "ipywidgets>=8.1.9",
    "lxml>=6.1.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai>=2.14.0",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.2",
    "tqdm>=4.70.0",
    "sentence-transformers>=5.1.2",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "torchxrayvision>=1.5.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
]
